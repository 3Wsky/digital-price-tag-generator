name: Refresh Product Data

on:
  workflow_dispatch:
  schedule:
    # Beijing 04:10 every day
    - cron: '10 20 * * *'

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Discover new product models
        run: node server.mjs --discover-models --models data/models.txt --max-new 12 --candidate-limit 18

      - name: Refresh products.json
        env:
          ZHIHU_ACCESS_SECRET: ${{ secrets.ZHIHU_ACCESS_SECRET }}
        run: node server.mjs --build-data --models data/models.txt --out public/data/products.json --refresh-limit 20 --stale-days 5 --delay-min-ms 3000 --delay-max-ms 8000

      - name: Refresh DJI products
        run: node server.mjs --build-dji-data --models data/dji-products.txt --out public/data/dji-products.json --delay-min-ms 2000 --delay-max-ms 5000

      - name: Validate JSON
        run: node -e "const fs=require('fs');for(const p of ['public/data/products.json','public/data/dji-products.json']){const d=JSON.parse(fs.readFileSync(p,'utf8'));const ok=Object.values(d).filter(x=>x&&x.ok).length;console.log(p,'entries',Object.keys(d).length,'ok',ok);if(!Object.keys(d).length)process.exit(1)}"

      - name: Commit updated product data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): refresh product data"
          file_pattern: data/models.txt data/dji-products.txt public/data/products.json public/data/dji-products.json

      # 失败通知：定时任务挂掉时自动开 issue（已有未关闭的则追加评论），避免静默失败
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = `定时数据刷新任务失败，请查看运行日志排查：${runUrl}`
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'data-refresh-failure',
            })
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '数据刷新任务失败，需要人工排查',
                body,
                labels: ['data-refresh-failure'],
              })
            }

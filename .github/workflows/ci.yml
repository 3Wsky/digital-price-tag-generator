name: CI

# 质量门禁：push 到 main 和所有 PR 都必须通过 lint / 测试 / 构建
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # build 脚本已包含 tsc -b，类型检查和产物构建一步完成
      - name: Type check & build
        run: npm run build
